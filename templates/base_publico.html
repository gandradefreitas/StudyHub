<!DOCTYPE html>
<html lang="pt-br">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-SXV3F6JX2D"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-SXV3F6JX2D');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{% block descricao %}StudyHub: plataforma para organizar seus estudos, tarefas e acompanhar seu desempenho.{% endblock %}">
    <!-- Open Graph -->
    <meta property="og:title" content="{% block og_titulo %}StudyHub - Organize seus estudos{% endblock %}">
    <meta property="og:description" content="{% block og_descricao %}Organize seus estudos, resolva questões e acompanhe seu desempenho com o StudyHub.{% endblock %}">
    <meta property="og:image" content="{{ url_for('static', filename='imagens/studyhub-og-image.png', _external=True) }}">
    <meta property="og:url" content="{{ request.url }}">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="StudyHub">
    <meta property="og:locale" content="pt_BR">
    <link rel="stylesheet" href="{{ url_for('static', filename='global.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='componentes/flash_messages.css') }}">


    {% block css %}

    {% endblock %}

    <link rel="stylesheet" href="{{ url_for('static', filename='componentes/bootstrap-icons-studyhub.css') }}">

    <title>

    {% block titulo %}
    StudyHub
    {% endblock %}

    </title>
</head>
<body>

    {% block conteudo %}

    {% endblock %}

    {% block scripts %}

    {% endblock %}

<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>

</body>
</html>
