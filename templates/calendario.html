<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{{ url_for('static', filename='global.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='componentes/sidebar.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='componentes/header_dashboard.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='componentes/flash_messages.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='paginas/calendario.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>Calendário</title>
</head>
<body class="sidebar-toggle" data-tema="{{ usuario['tema'] }}">

    {% include "componentes/sidebar.html" %}

    <main class="conteudo">

        {% include "componentes/header_dashboard.html" %}

        <!-- =========================================
             CABEÇALHO
        ========================================== -->

        <section class="cabecalho-calendario">

            <div class="cabecalho-calendario-info">

                <span class="subtitulo-calendario">
                    ORGANIZAÇÃO
                </span>

                <h1>Calendário</h1>

                <p>Acompanhe seus estudos e seu histórico de atividades.</p>

            </div>

        </section>

        <!-- =========================================
             CONTEÚDO
        ========================================== -->

        <section class="conteudo-calendario">

            <!-- =========================================
                 CALENDÁRIO
            ========================================== -->

            <section class="calendario-container">

                <div class="cabecalho-calendario-mes">

                    <button type="button" id="calendario-mes-anterior" class="botao-navegacao-calendario" aria-label="Mês anterior">

                        <i class="bi bi-chevron-left"></i>

                    </button>

                    <h2 id="calendario-mes-atual">
                        Agosto 2026
                    </h2>


                    <button type="button" id="calendario-mes-proximo" class="botao-navegacao-calendario" aria-label="Próximo mês">

                        <i class="bi bi-chevron-right"></i>

                    </button>

                </div>


                <div class="calendario-dias-semana">

                    <span>Seg</span>
                    <span>Ter</span>
                    <span>Qua</span>
                    <span>Qui</span>
                    <span>Sex</span>
                    <span>Sáb</span>
                    <span>Dom</span>

                </div>

                <div id="calendario-dias" class="calendario-dias"></div>

            </section>

            <!-- =========================================
                 DETALHES DO DIA
            ========================================== -->

            <aside class="calendario-detalhes-dia">


                <div class="calendario-detalhes-vazio">

                    <i class="bi bi-calendar3"></i>

                    <h2>Selecione um dia</h2>

                    <p>
                        Selecione uma data no calendário
                        para visualizar suas atividades.
                    </p>

                </div>

            </aside>

        </section>

    </main>

    <script
        src="{{ url_for('static', filename='js/dashboard.js') }}"
    ></script>

    <script
        src="{{ url_for('static', filename='js/calendario.js') }}"
    ></script>

</body>
</html>
