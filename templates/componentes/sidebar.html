<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

<aside class="sidebar" id="sidebar">

    <div class="logo"><h2>StudyHub</h2></div>

    <nav>

        <a href="{{ url_for('dashboard') }}">
            <i class="bi bi-house-door-fill"></i>
            Menu
        </a>

        <a href="{{ url_for('questoes_inicio') }}">
            <i class="bi bi-stopwatch"></i>
            Estudos
        </a>

        <a href="{{ url_for('pagina_provas') }}">
            <i class="bi bi-file-earmark-text"></i>
            Provas
        </a>

        <a href="{{ url_for('historico_provas') }}">
            <i class="bi bi-clock-history"></i>
            Histórico
        </a>

        <a href="{{ url_for('pagina_notas') }}"{% if request.endpoint == 'pagina_notas' %} aria-current="page"{% endif %}>
            <i class="bi bi-card-checklist" aria-hidden="true"></i>
            Notas
        </a>

        <a href="{{ url_for('idiomas.listar') }}"{% if request.blueprint == 'idiomas' %} aria-current="page"{% endif %}>
            <i class="bi bi-translate" aria-hidden="true"></i>
            Idiomas
        </a>

        <a href="{{ url_for('redacoes.listar') }}"{% if request.blueprint == 'redacoes' %} aria-current="page"{% endif %}>
            <i class="bi bi-pencil-square" aria-hidden="true"></i>
            Redações
        </a>

        <a href="{{ url_for('pagina_tarefas') }}">
            <i class="bi bi-list-check"></i>
            Tarefas
        </a>

        <a href="{{ url_for('pagina_calendario') }}">
            <i class="bi bi-calendar3"></i>
            Calendário
        </a>

        <a href="{{ url_for('pagina_estatisticas') }}">
            <i class="bi bi-bar-chart-line"></i>
            Estatísticas
        </a>

        <a href="{{ url_for('pagina_configuracoes') }}">
            <i class="bi bi-gear"></i>
            Configurações
        </a>

        <form method="POST" action="{{ url_for('logout') }}">

            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token() }}"
            >

            <button type="submit">
                <i class="bi bi-box-arrow-right"></i>
                Sair
            </button>

        </form>

    </nav>

</aside>
