
<header class="header-dashboard">


    <div class="header-esquerda">
        <button id="btn-menu" class="btn-menu">☰</button>

        {% if mostrar_pesquisa %}

        <input type="text" placeholder="Pesquisar..." disabled>

        {% endif %}
    </div>

    {% if mostrar_perfil %}

    <div class="perfil">

        <span>{{ usuario["nome"] }}</span>

        <div class="avatar">

            {{ usuario["nome"][0] }}

        </div>

    </div>

    {% endif %}

</header>
