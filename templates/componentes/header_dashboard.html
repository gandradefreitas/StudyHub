<header class="header-dashboard">

    <div class="header-esquerda">
        <button type="button" id="btn-menu" class="btn-menu" aria-label="Menu principal" aria-controls="sidebar" aria-expanded="false">☰</button>
    </div>

    {% if mostrar_perfil %}

    <button type="button" class="perfil" id="abrir-perfil" aria-label="Editar perfil"
            aria-haspopup="dialog" aria-controls="janela-perfil">
        <span class="perfil-nome">{{ usuario.nome }}</span>
        <span class="avatar" aria-hidden="true" data-avatar-moldura="{{ progresso_nivel.moldura_equipada }}">
            {% if tem_foto_perfil %}
                <img src="{{ url_for('perfil.foto') }}" alt="">
            {% else %}
                {{ usuario.nome[0] }}
            {% endif %}
        </span>
    </button>

    {% include "componentes/janela_perfil.html" %}

    {% endif %}

</header>
